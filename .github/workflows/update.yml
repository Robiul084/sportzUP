name: Update SportsPulse Playlist

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

# GitHub Actions-কে Repo-তে Push করার অনুমতি দেওয়া হলো
permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Update Script
        env:
          SOURCE_M3U_URL: ${{ secrets.SOURCE_M3U_URL }}
          FILTER_KEYWORD: ${{ secrets.FILTER_KEYWORD }}
        run: python update_playlist.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist" && git push)
